<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 진짜 정보판 v3 - 달 모양</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    .value { font-size: 48px; font-weight: bold; }
    .sub { color: #555; margin-top: 4px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f3f3f3; width: 38%; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: bold; margin-top: 8px; }
    .fresh { background: #e6f4ea; color: #137333; }
    .stale { background: #fef3e0; color: #b45309; }
    .msg { border-left: 4px solid #b45309; background: #fffaf0; padding: 10px 12px; margin-top: 10px; }
    .ok { color: green; }
    .ng { color: red; }
    button { padding: 8px 12px; margin: 4px 4px 4px 0; cursor: pointer; font-size: 14px; }
    .panel { border: 2px dashed #999; border-radius: 8px; padding: 12px 16px; margin-top: 28px; }
    .note { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>오늘의 달 모양 (대전)</h1>
  <div id="live">불러오는 중…</div>

  <div class="panel">
    <h2>실패 연습 화면 (합성 시험값)</h2>
    <p class="note">
      아래는 <b>연습용 가짜 값</b>이에요. 위의 실제 달 모양 값과 섞이지 않고, 날짜(2026-08-24 등)도 가상의 날짜예요.
      버튼을 누르면 "정상 값 2번 받기 → 실패 1번" 순서로 자동 재생돼요.
    </p>
    <div>
      <button onclick="runFailure('T04-TIMEOUT')">1. 느린 응답</button>
      <button onclick="runFailure('T04-AUTH-401')">2. 접근 거절 (401)</button>
      <button onclick="runFailure('T04-RATE-429')">3. 요청 제한 (429)</button>
      <button onclick="runFailure('T04-OFFLINE')">4. 인터넷 끊김</button>
      <button onclick="runFailure('T04-SCHEMA-BREAK')">5. 데이터 모양 이상</button>
    </div>
    <div>
      <button onclick="runNormal()">정상 3일 재생</button>
      <button onclick="resetSynth()">초기화</button>
    </div>
    <div id="synth"></div>
  </div>

<script>
// ===== 합성 시험값 (과제 공개 자료의 fixture를 그대로 옮김) =====
const FIXTURES = {
  "T04-AUTH-401": {
    "transport": {
      "mode": "http",
      "status": 401,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json"
      }
    },
    "payload": {
      "message": "unauthorized synthetic fixture"
    }
  },
  "T04-NORMAL-D1-A": {
    "transport": {
      "mode": "http",
      "status": 200,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json"
      }
    },
    "payload": {
      "signal_id": "aleph-demo-index",
      "normalized_value": 100,
      "unit": "pt",
      "source_name": "ALEPH 결정론 replay",
      "source_url": "https://fixtures.aleph.invalid/t04/demo-index",
      "source_time": "2026-08-23T23:59:00.000Z",
      "fetched_at": "2026-08-24T00:00:00.000Z",
      "record_timezone": "Asia/Seoul",
      "record_date": "2026-08-24"
    }
  },
  "T04-NORMAL-D1-B": {
    "transport": {
      "mode": "http",
      "status": 200,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json"
      }
    },
    "payload": {
      "signal_id": "aleph-demo-index",
      "normalized_value": 105,
      "unit": "pt",
      "source_name": "ALEPH 결정론 replay",
      "source_url": "https://fixtures.aleph.invalid/t04/demo-index",
      "source_time": null,
      "fetched_at": "2026-08-24T09:00:00.000Z",
      "record_timezone": "Asia/Seoul",
      "record_date": "2026-08-24"
    }
  },
  "T04-NORMAL-D2": {
    "transport": {
      "mode": "http",
      "status": 200,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json"
      }
    },
    "payload": {
      "signal_id": "aleph-demo-index",
      "normalized_value": 120,
      "unit": "pt",
      "source_name": "ALEPH 결정론 replay",
      "source_url": "https://fixtures.aleph.invalid/t04/demo-index",
      "source_time": "2026-08-24T23:59:00.000Z",
      "fetched_at": "2026-08-25T00:00:00.000Z",
      "record_timezone": "Asia/Seoul",
      "record_date": "2026-08-25"
    }
  },
  "T04-OFFLINE": {
    "transport": {
      "mode": "offline",
      "status": null,
      "delay_ms": 0,
      "deadline_ms": 1500,
      "headers": {}
    },
    "payload": null
  },
  "T04-RATE-429": {
    "transport": {
      "mode": "http",
      "status": 429,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json",
        "retry-after": "60"
      }
    },
    "payload": {
      "message": "rate limited synthetic fixture"
    }
  },
  "T04-RECOVER-D2": {
    "transport": {
      "mode": "http",
      "status": 200,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json"
      }
    },
    "payload": {
      "signal_id": "aleph-demo-index",
      "normalized_value": 120,
      "unit": "pt",
      "source_name": "ALEPH 결정론 replay",
      "source_url": "https://fixtures.aleph.invalid/t04/demo-index",
      "source_time": "2026-08-24T23:59:00.000Z",
      "fetched_at": "2026-08-25T00:00:00.000Z",
      "record_timezone": "Asia/Seoul",
      "record_date": "2026-08-25"
    }
  },
  "T04-SCHEMA-BREAK": {
    "transport": {
      "mode": "http",
      "status": 200,
      "delay_ms": 20,
      "deadline_ms": 1500,
      "headers": {
        "content-type": "application/json"
      }
    },
    "payload": {
      "signal_id": "aleph-demo-index",
      "normalized_value": "105",
      "unit": "pt",
      "source_name": "ALEPH 결정론 replay",
      "source_url": "https://fixtures.aleph.invalid/t04/demo-index",
      "source_time": null,
      "fetched_at": "2026-08-24T10:04:00.000Z",
      "record_timezone": "Asia/Seoul",
      "record_date": "2026-08-24"
    }
  },
  "T04-TIMEOUT": {
    "transport": {
      "mode": "timeout",
      "status": null,
      "delay_ms": 5000,
      "deadline_ms": 1500,
      "headers": {}
    },
    "payload": null
  }
};

/*CORE-START*/
// ===== 핵심 규칙 (실제 조회와 합성 재생이 똑같이 사용) =====
function emptyState() {
  return { rows: {}, status: { freshness: "fresh", error_code: "none", retry_after: null } };
}

// 받은 값이 약속된 모양인지 검사
function validateReading(p) {
  if (!p || typeof p !== "object") return false;
  const keys = ["signal_id", "normalized_value", "unit", "source_name", "source_url",
                "source_time", "fetched_at", "record_timezone", "record_date"];
  for (const k of keys) { if (!(k in p)) return false; }
  if (Object.keys(p).length !== keys.length) return false;
  if (typeof p.signal_id !== "string" || p.signal_id.length > 100 || !/^[a-z0-9][a-z0-9._-]*$/.test(p.signal_id)) return false;
  if (typeof p.normalized_value !== "number" || !Number.isFinite(p.normalized_value)) return false;
  if (typeof p.unit !== "string" || p.unit.length < 1 || p.unit.length > 24) return false;
  if (typeof p.source_name !== "string" || p.source_name.length < 1 || p.source_name.length > 120) return false;
  if (typeof p.source_url !== "string" || !/^https:\/\//.test(p.source_url)) return false;
  if (p.source_time !== null && (typeof p.source_time !== "string" || isNaN(Date.parse(p.source_time)))) return false;
  if (typeof p.fetched_at !== "string" || isNaN(Date.parse(p.fetched_at))) return false;
  if (p.record_timezone !== "Asia/Seoul") return false;
  if (typeof p.record_date !== "string" || !/^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])$/.test(p.record_date)) return false;
  return true;
}

// 정상 값: 같은 신호+같은 날짜면 새 행을 만들지 않고 그 행을 갱신
function applySuccess(state, payload, extra) {
  const id = payload.signal_id + "|" + payload.record_date;
  state.rows[id] = { record_id: id, reading: payload, extra: extra || {} };
  state.status = { freshness: "fresh", error_code: "none", retry_after: null };
  return state;
}

// 실패: 저장된 값(rows)은 절대 건드리지 않고 상태만 바꿈
function applyFailure(state, code, retryAfter) {
  state.status = { freshness: "stale", error_code: code, retry_after: retryAfter || null };
  return state;
}

function rowList(state) {
  return Object.values(state.rows).sort((a, b) =>
    a.reading.record_date < b.reading.record_date ? -1 : a.reading.record_date > b.reading.record_date ? 1 : 0);
}
function lastRow(state) { const l = rowList(state); return l.length ? l[l.length - 1] : null; }
function deltaOf(state) {
  const l = rowList(state);
  return l.length >= 2 ? l[l.length - 1].reading.normalized_value - l[l.length - 2].reading.normalized_value : null;
}

// 합성 fixture 한 건이 어떤 결과인지 판정
function classifyReplay(fx) {
  const t = fx.transport;
  if (t.mode === "offline") return { kind: "failure", code: "offline" };
  if (t.mode === "timeout" || t.delay_ms > t.deadline_ms) return { kind: "failure", code: "timeout" };
  if (t.status === 401 || t.status === 403) return { kind: "failure", code: "auth" };
  if (t.status === 429) {
    const ra = parseInt((t.headers || {})["retry-after"], 10);
    return { kind: "failure", code: "rate_limit", retryAfter: Number.isFinite(ra) ? ra : null };
  }
  if (t.status === 200) return { kind: "success", payload: fx.payload };
  return { kind: "failure", code: "offline" };
}

// 결과를 저장 상태에 반영 (모양이 틀린 정상 응답은 schema_error)
function ingest(state, result, extra) {
  if (result.kind === "success") {
    if (!validateReading(result.payload)) return applyFailure(state, "schema_error");
    return applySuccess(state, result.payload, extra);
  }
  return applyFailure(state, result.code, result.retryAfter);
}
/*CORE-END*/

// ===== 실패 종류별 안내 문구 =====
const MSG = {
  timeout:      { title: "응답이 너무 늦어요", why: "데이터 원천이 제한시간 안에 답하지 않았어요.", action: "잠시 기다린 뒤 '다시 시도'를 눌러 보세요." },
  auth:         { title: "데이터 원천이 접근을 거절했어요 (401/403)", why: "원천 쪽에서 허용하지 않아 값을 가져오지 못했어요.", action: "바로 다시 해도 같은 결과일 수 있어요. 원천의 이용 안내를 확인해 보세요." },
  rate_limit:   { title: "요청이 너무 많아 잠시 막혔어요 (429)", why: "짧은 시간에 너무 자주 요청해서 원천이 제한을 걸었어요.", action: "안내된 시간이 지난 뒤에 '다시 시도'를 눌러 주세요." },
  offline:      { title: "인터넷 연결이 없어요", why: "데이터 원천에 닿지 못했어요.", action: "연결을 확인한 뒤 '다시 시도'를 눌러 보세요." },
  schema_error: { title: "받은 데이터의 모양이 달라요", why: "값이 약속된 형식이 아니라서 믿을 수 없어 저장하지 않았어요.", action: "'다시 시도'를 눌러 보고, 계속되면 원천이 바뀌었는지 확인해 주세요." }
};

const PHASE_KO = {
  "New Moon": "삭 (달이 안 보임)", "Waxing Crescent": "초승달", "First Quarter": "상현달",
  "Waxing Gibbous": "차오르는 볼록달", "Full Moon": "보름달", "Waning Gibbous": "기우는 볼록달",
  "Last Quarter": "하현달", "Waning Crescent": "그믐달"
};

function pad(n) { return String(n).padStart(2, "0"); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(iso) { return new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }); }

// ===== 브라우저 저장 (실제값과 합성값은 서로 다른 칸에 따로 저장) =====
function loadState(ns) {
  try { const s = JSON.parse(localStorage.getItem("t04_" + ns)); if (s && s.rows && s.status) return s; } catch (e) {}
  return emptyState();
}
function saveState(ns, s) { try { localStorage.setItem("t04_" + ns, JSON.stringify(s)); } catch (e) {} }

// ===== 화면 그리기 =====
function renderBoard(el, state, opt) {
  const last = lastRow(state);
  const st = state.status;
  let h = "";
  if (!last) {
    h += '<div class="value">-</div>' + (st.freshness === "stale" ? "" : '<div class="sub">' + esc(opt.emptyText) + "</div>");
  } else {
    const r = last.reading;
    h += '<div class="value">' + esc(r.normalized_value) + " " + esc(r.unit) + "</div>";
    if (opt.live && last.extra.phase) h += '<div class="sub">달 모양: ' + esc(last.extra.phase) + "</div>";
  }
  if (last || st.freshness === "stale") {
    h += '<div class="badge ' + st.freshness + '">' + esc(st.freshness) + " / " + esc(st.error_code) + "</div>";
  }
  if (st.freshness === "stale") {
    const m = MSG[st.error_code];
    h += '<div class="msg"><b>' + esc(m.title) + "</b><br>" + esc(m.why) + "<br><b>할 일:</b> " + esc(m.action);
    if (st.error_code === "rate_limit" && st.retry_after) h += " (약 " + esc(st.retry_after) + "초 뒤)";
    if (last) h += "<br><b>오래된 값이에요.</b> 마지막으로 정상 수신한 시각: " + esc(fmt(last.reading.fetched_at)) + " (KST)";
    else h += "<br>아직 정상으로 받은 값이 없어요.";
    h += '</div><button onclick="' + opt.retryFn + '()">다시 시도</button>';
  }
  if (last) {
    const r = last.reading;
    const srcTime = opt.live && last.extra.source_text ? last.extra.source_text : (r.source_time ? fmt(r.source_time) + " (KST)" : "없음 (출처가 시각을 주지 않음)");
    h += "<table>";
    h += "<tr><th>단위</th><td>" + esc(opt.live ? "% (달의 밝은 부분 비율)" : r.unit) + "</td></tr>";
    h += "<tr><th>출처</th><td>" + esc(r.source_name) + "</td></tr>";
    h += "<tr><th>출처 시각</th><td>" + esc(srcTime) + "</td></tr>";
    h += "<tr><th>조회 시각 (마지막 정상)</th><td>" + esc(fmt(r.fetched_at)) + " (KST)</td></tr>";
    h += "<tr><th>기준 시간대</th><td>" + esc(r.record_timezone) + " (한국 시간, KST)</td></tr>";
    if (!opt.live) {
      h += "<tr><th>저장된 일별 행</th><td>" + rowList(state).length + "건</td></tr>";
      h += "<tr><th>마지막 정상값</th><td>" + esc(r.normalized_value) + "</td></tr>";
      const d = deltaOf(state);
      if (d !== null) h += "<tr><th>전일 대비</th><td>" + (d > 0 ? "+" : "") + esc(d) + "</td></tr>";
    }
    h += "</table>";
    if (opt.live) {
      const same = last.extra.raw === r.normalized_value + "%";
      h += "<h3>값 대조</h3><table>";
      h += "<tr><th>원자료 (API 응답)</th><td>" + esc(last.extra.raw) + "</td></tr>";
      h += "<tr><th>저장값</th><td>" + esc(r.normalized_value) + "</td></tr>";
      h += "<tr><th>화면값</th><td>" + esc(r.normalized_value) + "</td></tr>";
      h += '<tr><th>일치 여부</th><td class="' + (same ? "ok" : "ng") + '">' + (same ? "일치" : "불일치") + "</td></tr>";
      h += "</table>";
    }
  }
  document.getElementById(el).innerHTML = h;
}

function renderLive() {
  renderBoard("live", loadState("live"), { live: true, emptyText: "불러오는 중…", retryFn: "runLive" });
}
function renderSynth() {
  renderBoard("synth", loadState("synthetic"), { live: false, emptyText: "초기화된 상태예요. 위의 버튼을 눌러 보세요.", retryFn: "retrySynth" });
}

// ===== 실제 조회 =====
const API_BASE = "https://aa.usno.navy.mil/api/rstt/oneday";
const LIVE_DEADLINE_MS = 8000;

async function liveFetchOnce() {
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
  const url = API_BASE + "?date=" + today + "&coords=36.35,127.38&tz=9";
  if (typeof navigator !== "undefined" && navigator.onLine === false) return { res: { kind: "failure", code: "offline" } };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), LIVE_DEADLINE_MS);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (r.status === 401 || r.status === 403) return { res: { kind: "failure", code: "auth" } };
    if (r.status === 429) {
      const ra = parseInt(r.headers.get("retry-after"), 10);
      return { res: { kind: "failure", code: "rate_limit", retryAfter: Number.isFinite(ra) ? ra : null } };
    }
    if (!r.ok) return { res: { kind: "failure", code: "offline" } };
    let raw;
    try { raw = await r.json(); } catch (e) { return { res: { kind: "failure", code: "schema_error" } }; }
    const d = raw && raw.properties && raw.properties.data;
    const payload = {
      signal_id: "moon-illumination-daejeon",
      normalized_value: d ? parseInt(d.fracillum, 10) : NaN,
      unit: "%",
      source_name: "USNO (미국 해군천문대)",
      source_url: API_BASE,
      source_time: null,
      fetched_at: new Date().toISOString(),
      record_timezone: "Asia/Seoul",
      record_date: today
    };
    const extra = d ? {
      phase: PHASE_KO[d.curphase] || String(d.curphase),
      source_text: d.year + "-" + pad(d.month) + "-" + pad(d.day) + " (이 날짜 기준 데이터)",
      raw: String(d.fracillum)
    } : {};
    return { res: { kind: "success", payload: payload }, extra: extra };
  } catch (e) {
    if (e && e.name === "AbortError") return { res: { kind: "failure", code: "timeout" } };
    return { res: { kind: "failure", code: "offline" } };
  } finally {
    clearTimeout(timer);
  }
}

async function runLive() {
  const out = await liveFetchOnce();
  const s = ingest(loadState("live"), out.res, out.extra);
  saveState("live", s);
  renderLive();
}

// ===== 합성 재생 =====
function replay(ids, base) {
  let s = base || emptyState();
  for (const id of ids) s = ingest(s, classifyReplay(FIXTURES[id]));
  return s;
}
function runFailure(failId) {
  saveState("synthetic", replay(["T04-NORMAL-D1-A", "T04-NORMAL-D1-B", failId]));
  renderSynth();
}
function runNormal() {
  saveState("synthetic", replay(["T04-NORMAL-D1-A", "T04-NORMAL-D1-B", "T04-NORMAL-D2"]));
  renderSynth();
}
function retrySynth() {
  saveState("synthetic", replay(["T04-RECOVER-D2"], loadState("synthetic")));
  renderSynth();
}
function resetSynth() {
  try { localStorage.removeItem("t04_synthetic"); } catch (e) {}
  renderSynth();
}

// ===== 시작 =====
renderLive();
renderSynth();
runLive();
</script>
</body>
</html>

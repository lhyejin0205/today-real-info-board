  if (Object.keys(p).length !== keys.length) return false;
  if (typeof p.signal_id !== "string" || p.signal_id.length > 100 || !/^[a-z0-9][a-z0-9._-]*$/.test(p.signal_id)) return false;
  if (typeof p.normalized_value !== "number" || !Number.isFinite(p.normalized_value)) return false;
  if (typeof p.unit !== "string" || p.unit.length < 1 || p.unit.length > 24) return false;
  if (typeof p.source_name !== "string" || p.source_name.length < 1 || p.source_name.length > 120) return false;
  if (typeof p.source_url !== "string" || !/^https:\/\//.test(p.source_url)) return false;
  if (p.source_time !== null && (typeof p.source_time !== "string" || isNaN(Date.parse(p.source_time)))) return false;
  if (typeof p.fetched_at !== "string" || isNaN(Date.parse(p.fetched_at))) return false;
  if (p.record_timezone !== "Asia/Seoul") return false;
  if (typeof p.record_date !== "string" || !/^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])$/.test(p.record_date)) return false;
  return true;
}

// 정상 값: 같은 신호+같은 날짜면 새 행을 만들지 않고 그 행을 갱신
function applySuccess(state, payload, extra) {
  const id = payload.signal_id + "|" + payload.record_date;
  state.rows[id] = { record_id: id, reading: payload, extra: extra || {} };
  state.status = { freshness: "fresh", error_code: "none", retry_after: null };
  return state;
}

// 실패: 저장된 값(rows)은 절대 건드리지 않고 상태만 바꿈
function applyFailure(state, code, retryAfter) {
  state.status = { freshness: "stale", error_code: code, retry_after: retryAfter || null };
  return state;
}

function rowList(state) {
  return Object.values(state.rows).sort((a, b) =>
    a.reading.record_date < b.reading.record_date ? -1 : a.reading.record_date > b.reading.record_date ? 1 : 0);
}
function lastRow(state) { const l = rowList(state); return l.length ? l[l.length - 1] : null; }
function deltaOf(state) {
  const l = rowList(state);
  return l.length >= 2 ? l[l.length - 1].reading.normalized_value - l[l.length - 2].reading.normalized_value : null;
}

// 합성 fixture 한 건이 어떤 결과인지 판정
function classifyReplay(fx) {
  const t = fx.transport;
  if (t.mode === "offline") return { kind: "failure", code: "offline" };
  if (t.mode === "timeout" || t.delay_ms > t.deadline_ms) return { kind: "failure", code: "timeout" };
  if (t.status === 401 || t.status === 403) return { kind: "failure", code: "auth" };
  if (t.status === 429) {
    const ra = parseInt((t.headers || {})["retry-after"], 10);
    return { kind: "failure", code: "rate_limit", retryAfter: Number.isFinite(ra) ? ra : null };
  }
  if (t.status === 200) return { kind: "success", payload: fx.payload };
  return { kind: "failure", code: "offline" };
}

// 결과를 저장 상태에 반영 (모양이 틀린 정상 응답은 schema_error)
function ingest(state, result, extra) {
  if (result.kind === "success") {
    if (!validateReading(result.payload)) return applyFailure(state, "schema_error");
    return applySuccess(state, result.payload, extra);
  }
  return applyFailure(state, result.code, result.retryAfter);
}

// 두 날짜 사이 변화값: 날짜 순으로 놓은 마지막 두 기록을 같은 규칙(뒤 값 - 앞 값)으로 계산
function dailyDelta(list) {
  if (list.length < 2) return null;
  const a = list[list.length - 2], b = list[list.length - 1];
  const da = a.record_date.split("-").map(Number), db = b.record_date.split("-").map(Number);
  const gap = Math.round((Date.UTC(db[0], db[1] - 1, db[2]) - Date.UTC(da[0], da[1] - 1, da[2])) / 86400000);
  const delta = Math.round((b.normalized_value - a.normalized_value) * 1e6) / 1e6;
  return { from: a, to: b, gapDays: gap, delta: delta };
}
/*CORE-END*/

};

const PHASE_KO = {
  "New Moon": "삭 (달이 안 보임)", "Waxing Crescent": "초승달", "First Quarter": "상현달",
  "Waxing Gibbous": "차오르는 볼록달", "Full Moon": "보름달", "Waning Gibbous": "기우는 볼록달",
  "Last Quarter": "하현달", "Waning Crescent": "그믐달"
};

function pad(n) { return String(n).padStart(2, "0"); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(iso) { return new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }); }

// ===== 브라우저 저장 (실제값과 합성값은 서로 다른 칸에 따로 저장) =====
function loadState(ns) {
  try { const s = JSON.parse(localStorage.getItem("t04_" + ns)); if (s && s.rows && s.status) return s; } catch (e) {}
  return emptyState();
}
function saveState(ns, s) { try { localStorage.setItem("t04_" + ns, JSON.stringify(s)); } catch (e) {} }

// ===== 달 그림: 밝은 부분 비율과 차오름/기욺에 맞춰 그림 =====
function moonWaxing(extra) {
  let en = extra && extra.curphase;
  if (!en && extra && extra.phase) { for (const k in PHASE_KO) { if (PHASE_KO[k] === extra.phase) en = k; } }
  return !(en && (en.indexOf("Waning") === 0 || en === "Last Quarter"));
}
function moonSvg(pct, waxing) {
  const f = Math.max(0, Math.min(100, pct)) / 100;
  const rx = Math.abs(1 - 2 * f) * 60;
  const sweep = f > 0.5 ? 1 : 0;
  let lit = "";
  if (f > 0.995) lit = "M 0 -60 A 60 60 0 0 1 0 60 A 60 60 0 0 1 0 -60 Z";
  else if (f > 0.005) lit = "M 0 -60 A 60 60 0 0 1 0 60 A " + rx.toFixed(2) + " 60 0 0 " + sweep + " 0 -60 Z";
  const glow = (0.08 + f * 0.3).toFixed(2);
  const blur = Math.round(10 + f * 18);
  let s = '<svg class="moon" viewBox="-64 -64 128 128" role="img" aria-label="달의 밝은 부분 ' + Math.round(f * 100) + '퍼센트, ' +
          (waxing ? "오른쪽" : "왼쪽") + '이 밝아요" style="filter:drop-shadow(0 0 ' + blur + 'px rgba(240,228,170,' + glow + '))">';
  s += '<defs><radialGradient id="mDark" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#232c4d"/><stop offset="1" stop-color="#121830"/></radialGradient>' +
       '<radialGradient id="mLit" cx="40%" cy="38%" r="75%"><stop offset="0" stop-color="#fdf6d8"/><stop offset="1" stop-color="#d6cfb0"/></radialGradient>' +
       (lit ? '<clipPath id="mClip"><path d="' + lit + '"/></clipPath>' : "") + "</defs>";
  s += '<g' + (waxing ? "" : ' transform="scale(-1 1)"') + ">";
  s += '<circle r="60" fill="url(#mDark)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>';
  if (lit) {
    s += '<path d="' + lit + '" fill="url(#mLit)"/>';
    s += '<g clip-path="url(#mClip)" fill="#6b6650" opacity="0.14"><circle cx="-20" cy="-22" r="11"/><circle cx="14" cy="-8" r="7"/><circle cx="-6" cy="24" r="13"/><circle cx="28" cy="30" r="6"/><circle cx="-36" cy="6" r="5"/><circle cx="30" cy="-34" r="5"/></g>';
  }
  return s + "</g></svg>";
}

// ===== 화면 그리기 =====
function renderBoard(el, state, opt) {
  const last = lastRow(state);
  const st = state.status;
  let h = "";
  const badge = (last || st.freshness === "stale")
    ? '<div class="badge ' + st.freshness + '">' + esc(st.freshness) + " / " + esc(st.error_code) + "</div>" : "";
  if (!last) {
    h += '<div class="value"><span class="num">-</span></div>' + (st.freshness === "stale" ? "" : '<div class="sub">' + esc(opt.emptyText) + "</div>");
  } else {
    const r = last.reading;
    const valHtml = '<div class="value"><span class="num">' + esc(r.normalized_value) + '</span><span class="unit">' + esc(r.unit) + "</span></div>";
    if (opt.live) {
      h += '<div class="hero">' + moonSvg(r.normalized_value, moonWaxing(last.extra)) + '<div class="heroText">' + valHtml +
           (last.extra.phase ? '<div class="sub">' + esc(last.extra.phase) + "</div>" : "") + badge + "</div></div>";
    } else {
      h += valHtml;
    }
  }
  if (!(opt.live && last)) h += badge;
  if (st.freshness === "stale") {
    const m = MSG[st.error_code];
    h += '<div class="msg"><b>' + esc(m.title) + "</b><br>" + esc(m.why) + "<br><b>할 일:</b> " + esc(m.action);
    if (st.error_code === "rate_limit" && st.retry_after) h += " (약 " + esc(st.retry_after) + "초 뒤)";
    if (last) h += "<br><b>오래된 값이에요.</b> 마지막으로 정상 수신한 시각: " + esc(fmt(last.reading.fetched_at)) + " (KST)";
    else h += "<br>아직 정상으로 받은 값이 없어요.";
    h += '</div><button onclick="' + opt.retryFn + '()">다시 시도</button>';
  }
  if (last) {
    const r = last.reading;
    const srcTime = opt.live && last.extra.source_text ? last.extra.source_text : (r.source_time ? fmt(r.source_time) + " (KST)" : "없음 (출처가 시각을 주지 않음)");
    h += "<table>";
    h += "<tr><th>단위</th><td>" + esc(opt.live ? "% (달의 밝은 부분 비율)" : r.unit) + "</td></tr>";
    h += "<tr><th>출처</th><td>" + esc(r.source_name) + "</td></tr>";
    h += "<tr><th>출처 시각</th><td>" + esc(srcTime) + "</td></tr>";
    h += "<tr><th>조회 시각 (마지막 정상)</th><td>" + esc(fmt(r.fetched_at)) + " (KST)</td></tr>";
    h += "<tr><th>기준 시간대</th><td>" + esc(r.record_timezone) + " (한국 시간, KST)</td></tr>";
    if (!opt.live) {
      h += "<tr><th>저장된 일별 행</th><td>" + rowList(state).length + "건</td></tr>";
      h += "<tr><th>마지막 정상값</th><td>" + esc(r.normalized_value) + "</td></tr>";
      const d = deltaOf(state);
      if (d !== null) h += "<tr><th>전일 대비</th><td>" + (d > 0 ? "+" : "") + esc(d) + "</td></tr>";
    }
    h += "</table>";
    if (!opt.live) {
      h += "<h3>일별 행 (기준 시간대 날짜가 키)</h3><div class=\"scroll\"><table class=\"daily\"><tr><th>날짜(KST)</th><th>값</th><th>조회 시각(UTC)</th><th>KST 날짜와 일치</th></tr>";
      for (const row of rowList(state)) {
        const rr = row.reading;
        const kd = new Date(rr.fetched_at).toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
        h += "<tr><td>" + esc(rr.record_date) + "</td><td>" + esc(rr.normalized_value) + "</td><td>" + esc(rr.fetched_at) + "</td><td>" + (kd === rr.record_date ? "일치" : "불일치") + "</td></tr>";
      }
      h += "</table></div>";
      if (state.log) {
        h += "<h3>재실행 전후 행 수</h3><div class=\"scroll\"><table class=\"daily log\"><tr><th>순서</th><th>시험값</th><th>날짜</th><th>행 수 (전 → 후)</th></tr>";
        state.log.forEach((x, i) => {
          h += "<tr><td>" + (i + 1) + ". " + esc(x.label) + "</td><td>" + esc(x.id) + "</td><td>" + esc(x.date) + "</td><td>" + x.before + " → " + x.after + "</td></tr>";
        });
        h += "</table></div>";
      }
    }
    if (opt.live) {
      const same = last.extra.raw === r.normalized_value + "%";
      h += "<h3>값 대조</h3><table>";
      h += "<tr><th>원자료 (API 응답)</th><td>" + esc(last.extra.raw) + "</td></tr>";
      h += "<tr><th>저장값</th><td>" + esc(r.normalized_value) + "</td></tr>";
      h += "<tr><th>화면값</th><td>" + esc(r.normalized_value) + "</td></tr>";
      h += '<tr><th>일치 여부</th><td class="' + (same ? "ok" : "ng") + '">' + (same ? "일치" : "불일치") + "</td></tr>";
      h += "</table>";
    }
  }
  document.getElementById(el).innerHTML = h;
}

function renderLive() {
  renderBoard("live", loadState("live"), { live: true, emptyText: "불러오는 중…", retryFn: "runLive" });
}
function renderSynth() {
  renderBoard("synth", loadState("synthetic"), { live: false, emptyText: "초기화된 상태예요. 위의 버튼을 눌러 보세요.", retryFn: "retrySynth" });
}

// ===== 실제 조회 =====
const API_BASE = "https://aa.usno.navy.mil/api/rstt/oneday";
const LIVE_DEADLINE_MS = 8000;

async function liveFetchOnce() {
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
  const url = API_BASE + "?date=" + today + "&coords=36.35,127.38&tz=9";
  if (typeof navigator !== "undefined" && navigator.onLine === false) return { res: { kind: "failure", code: "offline" } };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), LIVE_DEADLINE_MS);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (r.status === 401 || r.status === 403) return { res: { kind: "failure", code: "auth" } };
    if (r.status === 429) {
      const ra = parseInt(r.headers.get("retry-after"), 10);
      return { res: { kind: "failure", code: "rate_limit", retryAfter: Number.isFinite(ra) ? ra : null } };
    }
    if (!r.ok) return { res: { kind: "failure", code: "offline" } };
    let raw;
    try { raw = await r.json(); } catch (e) { return { res: { kind: "failure", code: "schema_error" } }; }
    const d = raw && raw.properties && raw.properties.data;
    const payload = {
      signal_id: "moon-illumination-daejeon",
      normalized_value: d ? parseInt(d.fracillum, 10) : NaN,
      unit: "%",
      source_name: "USNO (미국 해군천문대)",
      source_url: API_BASE,
      source_time: null,
      fetched_at: new Date().toISOString(),
      record_timezone: "Asia/Seoul",
      record_date: today
    };
    const extra = d ? {
      curphase: String(d.curphase),
      phase: PHASE_KO[d.curphase] || String(d.curphase),
      source_text: d.year + "-" + pad(d.month) + "-" + pad(d.day) + " (이 날짜 기준 데이터)",
      raw: String(d.fracillum)
    } : {};
    return { res: { kind: "success", payload: payload }, extra: extra };
  } catch (e) {
    if (e && e.name === "AbortError") return { res: { kind: "failure", code: "timeout" } };
    return { res: { kind: "failure", code: "offline" } };
  } finally {
    clearTimeout(timer);
  }
}

async function runLive() {
  const out = await liveFetchOnce();
  const s = ingest(loadState("live"), out.res, out.extra);
  saveState("live", s);
  renderLive();
}

// ===== 합성 재생 =====
function replay(ids, base) {
  let s = base || emptyState();
  for (const id of ids) s = ingest(s, classifyReplay(FIXTURES[id]));
  return s;
}
function runFailure(failId) {
  saveState("synthetic", replay(["T04-NORMAL-D1-A", "T04-NORMAL-D1-B", failId]));
  renderSynth();
}
function runNormal() {
  saveState("synthetic", replay(["T04-NORMAL-D1-A", "T04-NORMAL-D1-B", "T04-NORMAL-D2"]));
  renderSynth();
}
function retrySynth() {
  const s = replay(["T04-RECOVER-D2"], loadState("synthetic"));
  delete s.log;
  saveState("synthetic", s);
  renderSynth();
}
// 같은 날 3번 + 다음 날 1번: 단계마다 행 수를 기록
function runDaily() {
  const steps = [
    ["T04-NORMAL-D1-A", "같은 날 1번째"],
    ["T04-NORMAL-D1-B", "같은 날 2번째"],
    ["T04-NORMAL-D1-B", "같은 날 3번째 (한 번 더)"],
    ["T04-NORMAL-D2", "다음 날 1번째"]
  ];
  let s = emptyState();
  const log = [];
  for (const [id, label] of steps) {
    const before = rowList(s).length;
    s = ingest(s, classifyReplay(FIXTURES[id]));
    log.push({ label: label, id: id, date: FIXTURES[id].payload.record_date, before: before, after: rowList(s).length });
  }
  s.log = log;
  saveState("synthetic", s);
  renderSynth();
}
function resetSynth() {
  try { localStorage.removeItem("t04_synthetic"); } catch (e) {}
  renderSynth();
}


// ===== 일별 기록 (GitHub Actions가 매일 저장한 data/history.json을 읽어서 표시) =====
function historyToReading(h) {
  return { signal_id: h.signal_id, normalized_value: h.normalized_value, unit: h.unit, source_name: h.source_name,
           source_url: h.source_url, source_time: h.source_observed_at || null, fetched_at: h.fetched_at,
           record_timezone: h.record_timezone, record_date: h.record_date };
}
function msgBox(code) {
  const m = MSG[code];
  return '<div class="msg"><b>' + esc(m.title) + "</b><br>" + esc(m.why) + "<br><b>할 일:</b> " + esc(m.action) + "</div>";
}
async function loadDaily() {
  let hist = null, status = null, err = null;
  try {
    const r = await fetch("data/history.json?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404) err = "none";
    else if (!r.ok) err = "offline";
    else hist = await r.json();
  } catch (e) { err = "offline"; }
  try {
    const r = await fetch("data/status.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) status = await r.json();
  } catch (e) {}
  renderDaily(hist, status, err);
}
function renderDaily(hist, status, err) {
  let h = "";
  if (status && status.freshness === "stale" && MSG[status.error_code]) {
    h += '<div class="badge stale">stale / ' + esc(status.error_code) + "</div>" + msgBox(status.error_code);
    h += "<p class=\"note\">아래 기록은 마지막으로 정상 저장된 값이에요. (오래된 값)</p>";
  }
  if (err === "none" || (hist && hist.length === 0)) {
    h += "<p>아직 저장된 기록이 없어요. 자동 저장이 한 번 실행되면 첫 기록이 생겨요.</p>";
  } else if (err || !Array.isArray(hist)) {
    h += msgBox(err || "schema_error") + '<button onclick="loadDaily()">다시 시도</button>';
  } else {
    const list = hist.map(historyToReading);
    if (!list.every(validateReading)) {
      h += msgBox("schema_error") + '<button onclick="loadDaily()">다시 시도</button>';
    } else {
      list.sort((a, b) => (a.record_date < b.record_date ? -1 : a.record_date > b.record_date ? 1 : 0));
      h += '<div class="scroll"><table class="daily"><tr><th>날짜(KST)</th><th>값</th><th>출처 주소</th><th>출처 관측 시각</th><th>조회 시각</th></tr>';
      for (const r of list) {
        h += "<tr><td>" + esc(r.record_date) + "</td><td>" + esc(r.normalized_value) + " " + esc(r.unit) + "</td><td>" + esc(r.source_url) +
             "</td><td>" + (r.source_time ? esc(fmt(r.source_time)) + " (KST)" : "없음") + "</td><td>" + esc(fmt(r.fetched_at)) + " (KST)</td></tr>";
      }
      h += "</table></div>";
      const d = dailyDelta(list);
      if (d) {
        const label = d.gapDays === 1 ? "어제 대비" : "직전 기록(" + d.gapDays + "일 전) 대비";
        h += '<div class="delta"><b>' + label + ":</b> " + esc(d.to.record_date) + " 값 " + esc(d.to.normalized_value) +
             " − " + esc(d.from.record_date) + " 값 " + esc(d.from.normalized_value) + " = <b>" + (d.delta > 0 ? "+" : "") + esc(d.delta) + " " + esc(d.to.unit) + "</b></div>";
      } else {
        h += '<div class="msg"><b>둘째 날 값이 아직 없어요.</b><br>기록을 만들어 내지 않고, 다음 날(한국 시간) 자동 저장이 되면 변화값을 계산해서 보여줘요.</div>';
      }
    }
  }
  document.getElementById("daily").innerHTML = h;
}

renderLive();
renderSynth();
runLive();
loadDaily();
</script>

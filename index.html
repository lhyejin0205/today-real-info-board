
<style>
:root {
  color-scheme: dark;
  --bg1: #080d24;
  --bg2: #211b49;
  --ink: #f5f3ff;
  --dim: #b9bbdf;
  --moon: #fff0bd;
  --line: rgba(203, 195, 255, .2);
  --mint: #9debd0;
  --amber: #ffd18b;
  --rose: #ffabbc;
}
* { box-sizing: border-box; }

html { min-height: 100%; background: var(--bg1); }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  line-height: 1.75;
  font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
  background:
    radial-gradient(ellipse at 15% 8%, rgba(116, 103, 205, .28), transparent 35%),
    radial-gradient(ellipse at 90% 42%, rgba(83, 103, 191, .18), transparent 38%),
    linear-gradient(160deg, #080d24 0%, #17183c 48%, #30214e 100%);
  background-attachment: fixed;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.stars::before,
.stars::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 50%;
}

.stars::before {
  width: 2px;
  height: 2px;
  background: #fff4cb;
  box-shadow:
    5vw 12vh #fff4cb, 13vw 32vh #b9caff,
    22vw 8vh #fff4cb, 31vw 24vh #ffffff,
    40vw 10vh #c8c2ff, 52vw 35vh #fff4cb,
    61vw 14vh #ffffff, 72vw 28vh #c8c2ff,
    84vw 9vh #fff4cb, 94vw 35vh #ffffff,
    9vw 66vh #c8c2ff, 20vw 82vh #ffffff,
    36vw 68vh #fff4cb, 48vw 91vh #ffffff,
    66vw 75vh #c8c2ff, 79vw 88vh #fff4cb,
    91vw 69vh #ffffff, 57vw 54vh #ffffff;
  animation: twinkle 4s ease-in-out infinite alternate;
}

.stars::after {
  width: 4px;
  height: 4px;
  background: #fff4cb;
  box-shadow:
    18vw 20vh 8px #fff4cb,
    77vw 17vh 9px #c9c4ff,
    88vw 56vh 7px #fff4cb,
    28vw 75vh 8px #c9c4ff,
    64vw 94vh 8px #fff4cb;
  animation: twinkle 3s ease-in-out infinite alternate-reverse;
}

@keyframes twinkle {
  from { opacity: .35; }
  to { opacity: 1; }
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 920px;
  margin: 0 auto;
  padding: 54px 24px 80px;
}

header {
  position: relative;
  text-align: center;
  padding: 28px 10px 38px;
  margin-bottom: 24px;
}

header::before {
  content: "☾";
  display: block;
  font-family: Georgia, serif;
  font-size: 78px;
  line-height: 1.2;
  color: var(--moon);
  text-shadow: 0 0 18px #fff0bd, 0 0 48px #a6a0ff;
  animation: moonGlow 4s ease-in-out infinite alternate;
}

@keyframes moonGlow {
  from { text-shadow: 0 0 14px #fff0bd, 0 0 30px #8d87dc; }
  to { text-shadow: 0 0 26px #fff0bd, 0 0 60px #aaa1ff; }
}

h1, h2, h3, .num, .unit {
  font-family: "Batang", "바탕", "Noto Serif KR", serif;
  font-weight: normal;
}

h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin: 4px 0 8px;
  color: var(--moon);
  letter-spacing: .06em;
  text-shadow: 0 0 24px rgba(255, 240, 189, .2);
}

.where {
  margin: 8px 0 0;
  color: var(--dim);
  font-size: 14px;
  letter-spacing: .04em;
}

h2 {
  font-size: 21px;
  margin: 38px 0 10px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  color: #e7dcff;
}

h3 {
  font-size: 16px;
  margin: 26px 0 8px;
  color: #d9d1ff;
}

.note {
  color: var(--dim);
  font-size: 14px;
  margin: 6px 0 16px;
}

#live, #daily, .panel {
  border: 1px solid rgba(192, 184, 255, .25);
  border-radius: 22px;
  padding: 25px;
  margin-top: 22px;
  background:
    linear-gradient(135deg, rgba(68, 67, 126, .34), rgba(22, 29, 67, .72));
  box-shadow:
    0 12px 40px rgba(0, 0, 0, .17),
    inset 0 1px rgba(255, 255, 255, .06);
  backdrop-filter: blur(12px);
}

.hero {
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}

.moon {
  width: 156px;
  height: 156px;
  flex: none;
}

.heroText { min-width: 0; }

.value { line-height: 1.25; }

.num {
  font-size: clamp(48px, 8vw, 76px);
  color: var(--moon);
  text-shadow: 0 0 26px rgba(255, 240, 189, .15);
}

.unit {
  font-size: 25px;
  margin-left: 6px;
  color: #d5d4f8;
}

.panel .value { margin-top: 18px; }
.panel .num { font-size: 48px; }
.panel .unit { font-size: 22px; }

.sub {
  color: #d0d0f0;
  margin-top: 8px;
  font-size: 17px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 5px 13px;
  border-radius: 999px;
  font-size: 13px;
  border: 1px solid currentColor;
  background: rgba(255, 255, 255, .035);
}

.badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 9px currentColor;
}

.fresh { color: var(--mint); }
.stale { color: var(--amber); }

.msg, .delta {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .045);
}

.msg {
  border-left: 3px solid var(--amber);
}
.delta {
  border-left: 3px solid var(--mint);
}

table {
  border-collapse: collapse;
  width: 100%;
  margin-top: 16px;
}

th, td {
  padding: 12px 10px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
  overflow-wrap: anywhere;
}

th {
  width: 38%;
  color: #c1c1e5;
  font-weight: normal;
}

td { color: var(--ink); }

.scroll {
  overflow-x: auto;
  border-radius: 12px;
}

.daily th {
  width: auto;
  font-size: 13px;
  background: rgba(153, 143, 232, .12);
}

.daily td { font-size: 13px; }
.daily td:first-child,
.daily td:nth-child(2) {
  white-space: nowrap;
  word-break: normal;
}
.daily.log td {
  white-space: normal;
  word-break: break-all;
}

.ok { color: var(--mint); }
.ng { color: var(--rose); }

button {
  font: inherit;
  font-size: 14px;
  color: #f5f1ff;
  background: linear-gradient(135deg, #45457e, #292f60);
  border: 1px solid rgba(193, 181, 255, .38);
  border-radius: 999px;
  padding: 10px 16px;
  margin: 6px 6px 0 0;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
  transition: transform .2s, box-shadow .2s, background .2s;
}

button:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, #625caa, #383e7b);
  box-shadow: 0 5px 20px rgba(155, 143, 255, .2);
}

button:active { transform: translateY(0); }

button:focus-visible {
  outline: 2px solid var(--moon);
  outline-offset: 3px;
}

.panel {
  margin-top: 40px;
  border-style: solid;
  border-color: rgba(255, 209, 139, .28);
}

.panel h2 {
  margin: 0 0 8px;
  padding-top: 0;
  border-top: 0;
}

@media (max-width: 600px) {
  .wrap { padding: 28px 14px 48px; }
  header { padding: 20px 4px 28px; }
  header::before { font-size: 64px; }
  #live, #daily, .panel {
    padding: 18px 14px;
    border-radius: 17px;
  }
  .moon { width: 120px; height: 120px; }
  .hero { gap: 14px; }
  .num { font-size: 52px; }
  .unit { font-size: 21px; }
  th, td { padding: 10px 6px; }
}
</style>
